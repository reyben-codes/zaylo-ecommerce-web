# Builds the Android app and publishes it as zaylo.apk on the Releases page, which the README's
# "Download the latest APK" link points to. Start it by pushing a version tag:
#
#   git tag v1.0.1
#   git push origin v1.0.1
#
# The app version comes from the tag (v1.0.1 -> 1.0.1), so pubspec.yaml does not need editing.
# The APK is signed with the team's debug key (the DEBUG_KEYSTORE_BASE64 secret). Phones can only update an app
# signed with the same key, and Google sign-in only works for keys registered as Android OAuth clients (checked below).
name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Use the team's signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Add the DEBUG_KEYSTORE_BASE64 secret first (see 'Publishing a new APK' in the README)."
            exit 1
          fi
          mkdir -p ~/.android
          # Copying on Windows can add a line break (\r\n), spaces or quotes, which base64 rejects; drop them first.
          SECRET=$(printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d "\r\n\t \"'")
          echo "Secret: ${#SECRET} characters (the team key encodes to 3492)."
          if ! printf '%s' "$SECRET" | base64 --decode > ~/.android/debug.keystore 2> /dev/null; then
            echo "::error::DEBUG_KEYSTORE_BASE64 is not valid base64 (${#SECRET} characters). Copy it again with the PowerShell command in the README and replace the secret."
            exit 1
          fi
          echo "Keystore: $(stat -c %s ~/.android/debug.keystore) bytes (the team key is 2618)."
          KEYTOOL_OUTPUT=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android 2>&1) || {
            echo "::error::DEBUG_KEYSTORE_BASE64 decodes to $(stat -c %s ~/.android/debug.keystore) bytes but is not the debug keystore (password 'android'): $(printf '%s' "$KEYTOOL_OUTPUT" | head -n 1)"
            exit 1
          }
          # Google sign-in only works when this SHA-1 is registered as an Android OAuth client in Google Cloud, so a
          # different key stops the release instead of shipping an app whose Google button fails.
          SHA1=$(printf '%s\n' "$KEYTOOL_OUTPUT" | grep 'SHA1:' | head -n 1 | awk '{print $2}')
          echo "Signing key SHA-1: $SHA1"
          case "$SHA1" in
            20:4D:5D:DF:E5:29:63:1D:B7:9D:73:6D:FD:02:7D:53:4D:EC:5D:F9|76:70:DD:8F:BA:94:A9:5E:16:10:34:D3:11:69:A1:50:D3:B3:4B:37) ;;
            *)
              echo "::error::The signing key's SHA-1 ($SHA1) is not registered for Google sign-in. Add it as an Android OAuth client (package com.example.zaylo_mobile) in Google Cloud, then list it here."
              exit 1
              ;;
          esac

      - run: flutter pub get

      - name: Build the APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Android only installs an update with a higher build number; the first manual release was 1.
          BUILD_NUMBER=$(( GITHUB_RUN_NUMBER + 1 ))
          flutter build apk --release --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          mv build/app/outputs/flutter-apk/app-release.apk zaylo.apk

      - uses: softprops/action-gh-release@v2
        with:
          name: ZAYLO ${{ github.ref_name }}
          files: mobile_app/zaylo.apk
          generate_release_notes: true
